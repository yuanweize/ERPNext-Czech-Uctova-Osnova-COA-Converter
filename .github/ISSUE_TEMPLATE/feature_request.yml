name: Feature Request
description: Propose an enhancement for ERPNext Czech COA Converter.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Feature Description
      description: What new capability or format support would you like to see?
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Use Case
      description: Explain why this feature is valuable for Czech ERPNext deployments.
